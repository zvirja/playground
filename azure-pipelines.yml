# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

name: $(Date:yyyyMMdd)$(Rev:.r)
trigger:
  branches:
    include:
    - develop
    - release/*
    - hotfix/*
    - master
    - main
    - support/*

# Perform build for a PR to any branch, as if you run PR, you most likely want CI checks.
pr: ['*']

pool:
  vmImage: ubuntu-latest

steps:
- script: echo Hello, world!
  displayName: 'Run a one-line script'

- script: '[ ! -f readme3 ] || (echo "readme3 file found" && sleep 30 && exit 1)'
  displayName: 'Fail if readme3 exists'

- script: '[[ "$(Build.SourceBranch)" == *"release/"* ]] && sleep 30 || echo "Not a release branch"'
  displayName: 'Sleep if release branch'

- script: |
    echo Add other tasks to build, test, and deploy your project.
    echo See https://aka.ms/yaml
  displayName: 'Run a multi-line script'
